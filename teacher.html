<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Панель вчителя</title>
<style>
:root{--bg:#f3f6f4;--ink:#16231e;--g:#0f6b52;--g2:#e1efe9;--mut:#5f6f68;--line:#dbe4df;--bad:#b3392f;--card:#fff;--side:#fff;--blue:#2563a8}
@media(prefers-color-scheme:dark){:root{--bg:#101815;--ink:#e6efeb;--g:#3fb18f;--g2:#1d2e28;--mut:#9fb2aa;--line:#2b3d36;--card:#17221e;--side:#141e1a;--blue:#7fb2e8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:8px;align-items:center;font-weight:700;font-size:1.1rem;color:var(--g);padding:2px 10px}
.brand+small{display:block;padding:0 10px 18px;color:var(--mut)}
.nv{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;margin:0 0 4px}
.nv:hover{background:var(--g2)}.nv.on{background:var(--g2);color:var(--g)}
.main{padding:24px 28px 56px;max-width:1120px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.65rem;margin:0}h2{font-size:1.1rem;margin:16px 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:20px}
.stat{display:flex;gap:12px;align-items:center;margin:0}
.ico{width:44px;height:44px;border-radius:12px;background:var(--g2);color:var(--g);display:grid;place-items:center;flex:none}
.stat b,.num{font-size:1.7rem;line-height:1.15;display:block}.num{display:inline}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.srow{display:grid;grid-template-columns:44px 1fr auto 80px 120px;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.srow:first-child,.trow:first-child{border-top:0}.srow:hover b{color:var(--g)}
.trow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 4px;border-top:1px solid var(--line)}
.trow>div:nth-child(2){flex:1;min-width:170px}.acts{display:flex;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 11px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--g2);color:var(--g);white-space:nowrap}
.chip.w{background:var(--line);color:var(--mut)}.chip.s{color:var(--blue)}
.pb,.bar{height:7px;border-radius:4px;background:var(--line);margin:3px 0 6px}.pb i,.bar i{display:block;height:100%;border-radius:4px;background:var(--g)}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 2px;margin:0 0 -1px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--g);border-color:var(--g)}
.lnk{background:none;border:0;padding:0;margin:0 0 10px;color:var(--g);font:inherit;font-weight:600;cursor:pointer}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:10px}
select,input[type=text],input[type=email],input[type=password],input[type=number],textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px}
button,.btn{font:inherit;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin:0 6px 6px 0;display:inline-block}
button:hover{border-color:var(--g)}
.qimg{max-width:100%;max-height:50vh;display:block;margin:10px 0;border-radius:8px}
.acts{align-items:center}.ag{display:inline-flex;flex-wrap:wrap;margin:0 8px 0 4px;padding-left:10px;border-left:2px solid var(--line)}
button.bl{background:color-mix(in srgb,var(--blue) 12%,var(--card));border-color:color-mix(in srgb,var(--blue) 35%,var(--card));color:var(--blue)}
details.more{position:relative;display:inline-block;margin:0 6px 6px 0}details.more>summary{list-style:none;cursor:pointer;font-weight:600;padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
details.more>summary::-webkit-details-marker{display:none}details.more[open]>summary{border-color:var(--g)}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column}
.menu button{margin:0 0 2px;text-align:left;border:0;background:none;width:100%}.menu button:hover{background:var(--g2)}
.sw{display:flex;align-items:center;gap:8px}.sw>input{flex:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,[role=button]:focus-visible{outline:3px solid var(--g);outline-offset:1px}
.pri{background:var(--g);border-color:var(--g);color:#fff}.danger{color:var(--bad)}
.err{color:var(--bad)}.mut{color:var(--mut)}.sm{font-size:.88rem}
.code{font:700 1.9rem/1.1 ui-monospace,Consolas,monospace;letter-spacing:.15em}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-top:1px solid var(--line)}th{border-top:0;color:var(--mut);font-size:.85rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.opt{display:flex;gap:8px;align-items:center;margin-top:6px}.opt input[type=radio]{width:20px;height:20px;margin:0;accent-color:var(--g)}
details{margin-top:8px}summary{cursor:pointer;font-weight:600}
@media(max-width:820px){
 .shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;align-items:center;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
 .brand,.brand+small{display:none}.nv{width:auto;white-space:nowrap;margin:0}.side>div[style]{display:none}
 .main{padding:16px 14px 40px}.srow{grid-template-columns:44px 1fr auto}.hm{display:none}input,select,textarea{font-size:16px}}
.pj{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
.pjc{max-width:900px;width:100%}.pjg{display:flex;gap:40px;justify-content:center;align-items:center;flex-wrap:wrap}
.qrb{background:#fff;padding:14px;border-radius:16px;width:min(300px,70vw)}.qrb svg{width:100%;height:auto;display:block}
.pjcode{font:700 clamp(3rem,11vw,8rem)/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--g)}
ol.how{padding-left:1.3em}ol.how li{margin:8px 0}
.rp{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:18px}
.rpb{max-width:1100px;margin:0 auto 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rpd{background:#fff;color:#16231e;max-width:1100px;margin:0 auto;padding:24px;border-radius:12px;overflow-x:auto}
.rps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 14px}
.rps div{background:#e1efe9;border-radius:10px;padding:8px 12px}.rps span{display:block;font-size:.8rem;color:#5f6f68}.rps b{font-size:1.3rem}
.rpt{width:100%;border-collapse:collapse;font-size:.95rem}.rpt th{background:#0f6b52;color:#fff;padding:8px 6px;text-align:center;border:0}
.rpt td{padding:7px 6px;border-top:1px solid #dbe4df;text-align:center}.rpt .l{text-align:left}.rpt tbody tr:nth-child(even){background:#f3f8f5}
.rpt .m.ok{color:#0f6b52;font-weight:700}.rpt .m.bad{color:#b3392f;font-weight:700}.rpt .m.sk{color:#8b97a0}.rpt tfoot td{font-weight:700;border-top:2px solid #0f6b52}
@media print{@page{size:A4 landscape;margin:10mm}body>*:not(#RP){display:none!important}.rp{position:static;padding:0;background:#fff;overflow:visible}.rpd{padding:0;max-width:none;overflow:visible}.noprint{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.tc{border-radius:999px;padding:4px 12px;font-size:.88rem;margin:0 6px 6px 0}.tc.on{background:var(--g);border-color:var(--g);color:#fff}
/* ---------- редактор тесту ---------- */
.ed{max-width:1180px}
.ed-head{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.ed-ttl{display:flex;gap:16px;align-items:center;min-width:0}
.ed-ico{width:60px;height:60px;border-radius:50%;background:var(--g2);color:var(--g);display:grid;place-items:center;flex:none;box-shadow:0 0 0 6px color-mix(in srgb,var(--g2) 45%,transparent)}
.ed-ico svg{width:28px;height:28px}.ed-ico.sm{width:46px;height:46px;box-shadow:none}.ed-ico.sm svg{width:24px;height:24px}
.ed h1{font-size:2rem;line-height:1.15;letter-spacing:-.015em}
.ed-acts,.ed-foot{display:flex;gap:10px;flex-wrap:wrap}.ed-foot{margin-top:20px}
.ed .bt{display:inline-flex;align-items:center;gap:8px;margin:0;padding:10px 18px;border-radius:12px}
.ed .bt svg{width:18px;height:18px;flex:none}
.ed .bt.dng{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.ed .bt.dng:hover{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--card))}
.ed .bt.ghost{background:var(--g2);border-color:transparent;color:var(--g)}.ed .bt.ghost:hover{border-color:var(--g)}
.ed .bt.ic{padding:0;width:40px;height:40px;justify-content:center;flex:none}
.ed .bt:disabled{opacity:.5;cursor:not-allowed}
.ed-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 26px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,107,82,.05),0 10px 28px rgba(15,107,82,.05)}
.ed-h{font-size:1.2rem;margin:0 0 18px}.sub{font-size:.98rem;margin:0 0 12px}
.ed-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:0 32px;align-items:start}
.ed-two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:end}
.ed .drop{padding-top:22px;padding-bottom:22px}
.ed .fl{display:block;margin:0 0 14px;font-size:.86rem}.fl .req{color:var(--bad)}.hint{font-weight:400}
.fmt{display:block;font-weight:400;font-size:.78rem;color:var(--mut);margin:2px 0 0}
.fl-t{font-weight:700;font-size:.92rem;margin:6px 0 8px}
.ed input[type=text],.ed input[type=number],.ed select,.ed textarea{margin-top:6px;padding:11px 14px;border-radius:12px;background:var(--card);font-weight:400}
.ed textarea{resize:vertical;min-height:46px;line-height:1.45}
.ed :is(input[type=text],input[type=number],select,textarea):focus-visible{outline:0;border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 24%,transparent)}
.ed .sel{position:relative;display:block;margin-top:6px}
.ed .sel select{margin:0;appearance:none;-webkit-appearance:none;padding-right:42px;cursor:pointer}
.ed .sel svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--g)}
.cnt{text-align:right;font-size:.75rem;color:var(--mut);margin:-8px 0 12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin:0 0 12px;cursor:pointer}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--g);flex:none}
.chk small{display:block;font-weight:400;font-size:.8rem;margin-top:2px}
.dropw{position:relative;margin:0 0 14px}
.drop{position:relative;display:flex;gap:14px;align-items:center;margin:0;padding:16px 54px 16px 18px;border:1.5px dashed color-mix(in srgb,var(--g) 40%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--g2) 55%,var(--card));cursor:pointer;color:var(--g);font-weight:400}
.drop:hover,.drop.over{border-color:var(--g)}.drop:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 24%,transparent)}
.drop svg{width:38px;height:38px;flex:none}.drop b{display:block;font-size:.9rem;word-break:break-all}.drop small{display:block;color:var(--mut);font-size:.78rem}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.dx{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;padding:0;margin:0;display:grid;place-items:center;color:var(--mut)}.dx svg{width:16px;height:16px}
.scale{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:2px 10px;margin:0 0 14px}.scale label{margin:0;font-size:.78rem}
.ed-box{margin-top:6px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--g2) 40%,var(--card))}
.qns{display:flex;flex-wrap:wrap;gap:6px}
.ed .qn{margin:0;min-width:36px;height:36px;padding:0 10px;border-radius:10px;display:inline-flex;gap:2px;align-items:center;justify-content:center}
.ed .qn.ok{background:var(--g2);border-color:transparent;color:var(--g)}.ed .qn.no{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.tip{display:flex;gap:8px;align-items:flex-start;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:.82rem;color:var(--mut)}.tip svg{width:18px;height:18px;flex:none;color:var(--g)}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 16px;border:1.5px dashed color-mix(in srgb,var(--g) 40%,var(--line));border-radius:14px}.addrow b{margin-right:4px}
.qcard{scroll-margin-top:16px;padding:20px 26px 24px}
.qhead{display:flex;gap:14px;align-items:center;margin-bottom:18px}.qhd{flex:1;min-width:0}
.qgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.qleft{padding-right:28px}.qright{border-left:1px solid var(--line);padding-left:28px}
.ans{display:flex;gap:10px;align-items:center;margin:0 0 8px}
.ans input[type=radio],.ans input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--g);flex:none}
.ed .ans input[type=text]{flex:1;min-width:0;margin:0;padding:9px 12px}.arr{color:var(--mut)}
.ed .addbar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0;padding:14px;border:1.5px dashed color-mix(in srgb,var(--g) 40%,var(--line));border-radius:14px;background:transparent;color:var(--g)}
.ed .addbar:hover{background:var(--g2);border-color:var(--g)}.addbar svg{width:18px;height:18px}
@media(max-width:820px){.ed h1{font-size:1.5rem}.ed-ico{width:46px;height:46px;box-shadow:none}.ed-ico svg{width:24px;height:24px}.qhd .sm{display:none}.ed .dq{padding:0;width:40px;height:40px;justify-content:center}.dq span{display:none}.qhead .bt span{display:inline}.qhead .dq span{display:none}.ed-grid,.qgrid,.ed-two{grid-template-columns:1fr}.qleft{padding-right:0}
 .qright{border-left:0;padding-left:0;border-top:1px solid var(--line);margin-top:8px;padding-top:16px}.ed-card,.qcard{padding:16px}.ed-acts{width:100%}.ed-acts .bt{flex:1;justify-content:center}}
.lnkbox{display:flex;width:100%;gap:12px;justify-content:space-between;align-items:center;text-align:left;margin:6px 0 14px;padding:11px 14px;border-radius:12px;background:var(--g2);border:1px dashed color-mix(in srgb,var(--g) 40%,var(--line));color:var(--g);font-weight:600;word-break:break-all}
.lnkbox:hover{border-style:solid;border-color:var(--g)}.lnkbox svg{flex:none}
button.cpc{display:block;background:none;border:0;padding:2px 6px;margin:2px 0 0 -6px;border-radius:10px;color:inherit;text-align:left;cursor:pointer}button.cpc:hover{background:var(--g2);color:var(--g)}
.toast{display:none;position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
</style>
</head>

const nrm=(v,cs)=>{const x=String(v??'').trim().replace(/[’ʼ`′]/g,"'").replace(/\s+/g,' ');return cs?x:x.toLowerCase()};
const uniq=a=>JSON.stringify([...new Set(a)].sort((x,y)=>x-y));
const qok=(q,a)=>{const t=q.type||'single';if(a==null)return false;if(a.__ov!==undefined)return a.__ov>=1;
  if(t=='single')return String(a)===String(q.c);
  if(t=='multi')return Array.isArray(a)&&uniq(a)===uniq(q.c);
  if(t=='short')return typeof a=='string'&&q.a.some(v=>nrm(v,q.cs)===nrm(a,q.cs));
  if(t=='match')return Array.isArray(a)&&a.length==q.pairs.length&&q.pairs.every((p,k)=>a[k]===p.r);
  return false};
const qpts=(q,a)=>{if(a!=null&&a.__ov!==undefined)return a.__ov;if(qok(q,a))return 1;const t=q.type||'single';if(!q.partial||a==null)return 0;
  if(t=='multi'&&Array.isArray(a)){const c=new Set(q.c),u=[...new Set(a)],g=u.filter(v=>c.has(v)).length;return Math.max(0,(g-(u.length-g))/c.size)}
  if(t=='match'&&Array.isArray(a))return q.pairs.filter((p,k)=>a[k]===p.r).length/q.pairs.length;return 0};
const fa=(q,a)=>{if(a!=null&&a.__ov!==undefined)a=a.v;const t=q.type||'single';if(a==null)return'—';
  if(t=='single')return q.o[a]??'—';
  if(t=='multi')return Array.isArray(a)&&a.length?a.map(k=>q.o[k]).join('; '):'—';
  if(t=='short')return String(a)||'—';
  return Array.isArray(a)?q.pairs.map((p,k)=>p.l+' → '+(a[k]??'—')).join('; '):'—'};
const fk=q=>{const t=q.type||'single';
  if(t=='single')return q.o[q.c];if(t=='multi')return q.c.map(k=>q.o[k]).join('; ');
  if(t=='short')return q.a.join(' / ');return q.pairs.map(p=>p.l+' → '+p.r).join('; ')};
function analysis(qs,D){
  const byQ=qs.map((q,i)=>{const k=D.filter(a=>qok(q,a.answers?.[i])).length,pp=D.filter(a=>{const v=qpts(q,a.answers?.[i]);return v>0&&v<1}).length,p=Math.round(D.reduce((x,a)=>x+qpts(q,a.answers?.[i]),0)/D.length*100),w={};
    D.forEach(a=>{const v=a.answers?.[i];if(v!=null&&!qok(q,v)){const key=fa(q,v);w[key]=(w[key]||0)+1}});
    const top=Object.entries(w).sort((x,y)=>y[1]-x[1])[0];
    return`<div><b>${i+1}. ${esc(qplain(q.q))}</b> <span class="mut">${k} з ${D.length} повністю${pp?', '+pp+' частково':''} (${p}%)</span><div class="bar"><i style="width:${p}%"></i></div>${top?`<span class="mut sm">Найчастіша помилка: «${esc(top[0])}» (${top[1]})</span>`:''}</div>`}).join('');
  const bySt=D.map(a=>{const w=qs.map((q,i)=>{const v=a.answers?.[i];return qok(q,v)?'':`<li>${i+1}. відповідь «${esc(fa(q,v))}», правильно «${esc(fk(q))}»${qpts(q,v)>0?' (частково)':''}</li>`}).join('');
    return`<details data-k="s${a.id}" data-d="false" ${X.has('s'+a.id)?'open':''}><summary>${esc(a.name)}: ${a.score} з ${a.total}</summary>${w?`<ul>${w}</ul>`:'<p class="mut">Без помилок.</p>'}</details>`}).join('');
  const pc=qs.map((q,i)=>Math.round(D.reduce((x,a)=>x+qpts(q,a.answers?.[i]),0)/D.length*100)),hard=pc.map((p,i)=>[i+1,p]).filter(x=>x[1]<80).sort((a,b)=>a[1]-b[1]).slice(0,3);
  const hb=`<div class="card" style="background:var(--g2)"><b>Експрес-підсумок</b><p style="margin:6px 0 0">${hard.length?`Найважче далося: ${hard.map(([n,p])=>`питання №${n} (${p}% правильних)`).join(', ')}. Варто розібрати з класом.`:'Клас упорався добре: жодне питання не нижче 80% правильних.'}</p></div>`;
  return`${hb}<h2>За питаннями</h2>${byQ}<h2>За учнями</h2>${bySt}`}
