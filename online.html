<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест онлайн</title>
<style>
:root{--bg:#eef2f0;--ink:#16231e;--g:#0f6b52;--g2:#d8e9e2;--mut:#5b6b64;--line:#c5d3cc;--bad:#b3392f;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#121a17;--ink:#e6efeb;--g:#3fb18f;--g2:#1d2e28;--mut:#9fb2aa;--line:#2f433b;--card:#18231f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 12px}h2{font-size:1.1rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:12px}
input[type=text],input[type=email],input[type=password]{display:block;width:100%;margin-top:4px;padding:9px 10px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px}
button,.btn{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin:0 6px 6px 0;display:inline-block}
button:focus-visible,input:focus-visible{outline:3px solid var(--g);outline-offset:1px}
.pri{background:var(--g);border-color:var(--g);color:#fff}.danger{color:var(--bad)}
.err{color:var(--bad);min-height:1.5em}.mut{color:var(--mut)}
.code{font:700 2rem/1 ui-monospace,Consolas,monospace;letter-spacing:.15em}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{text-align:left;padding:6px 8px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.read{font:1.35rem/1.7 Georgia,serif;user-select:none;-webkit-user-select:none}
.timer{height:8px;background:var(--g);border-radius:4px;margin-bottom:16px;transition:width 1s linear}
.q{margin-bottom:20px}.q h2{font-family:Georgia,serif;font-size:1.25rem}
.o{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-top:6px;cursor:pointer;font-weight:400}
.o input{width:20px;height:20px;accent-color:var(--g);margin:0}
.big{font-size:2.4rem;font-weight:700;color:var(--g)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const URL_='https://nyilajegoqdhujnvhsoe.supabase.co',KEY_='sb_publishable_HgNdf6MvwSLU4_7r5a-vrA_KKUvR9aw';
const $=s=>document.querySelector(s),view=h=>$('#app').innerHTML=h;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let TOK=sessionStorage.tk||null;
async function api(path,{method='GET',body,prefer}={}){
  const h={apikey:KEY_,'Content-Type':'application/json'};if(TOK)h.Authorization='Bearer '+TOK;if(prefer)h.Prefer=prefer;
  const r=await fetch(URL_+path,{method,headers:h,body:body&&JSON.stringify(body)});
  const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}
  if(!r.ok){if(r.status==401&&TOK){delete sessionStorage.tk;TOK=null}throw new Error((d&&(d.message||d.msg||d.error_description))||r.status)}
  return d}
const rpc=(n,b)=>api('/rest/v1/rpc/'+n,{method:'POST',body:b});
const MSG={no_session:'Заняття з таким кодом не знайдено або воно вже завершене.',name_taken:'Це ім\'я вже використано в цьому занятті. Якщо це ви, зверніться до вчителя.',bad_name:'Введіть ім\'я (до 40 символів).',closed:'Час на відповіді закінчився.',already:'Ви вже надіслали відповіді.',started:'Тест уже розпочався, приєднатися не можна. Зверніться до вчителя.'};
const say=e=>MSG[e.message]||e.message;

/* ================= УЧЕНЬ ================= */
function student(){
  const c0=new URLSearchParams(location.search).get('c')||'';
  view(`<h1>Приєднатися до тесту</h1><div class="card"><label>Код заняття<input type="text" id="c" value="${esc(c0)}" maxlength="6" autocapitalize="characters" autocomplete="off"></label>
  <label>Ваше ім'я<input type="text" id="n" maxlength="40" autocomplete="off"></label><button class="pri" id="j">Приєднатися</button><p class="err" id="e"></p></div>`);
  $('#j').onclick=async()=>{const c=$('#c').value.trim().toUpperCase();
    if(localStorage['rt-'+c])return run(c,localStorage['rt-'+c]);
    try{const tk=await rpc('join_session',{p_code:c,p_name:$('#n').value});localStorage['rt-'+c]=tk;run(c,tk)}catch(e){$('#e').textContent=say(e)}};
  const m=Object.keys(localStorage).find(k=>k.startsWith('rt-')&&k.slice(3)==c0.toUpperCase());
  if(m)run(c0.toUpperCase(),localStorage[m]);
}
function run(code,tok){
  let key='',active=true,dl=0,cd,poll,send=null;
  const stop=()=>{active=false;clearInterval(poll);clearInterval(cd)};
  document.addEventListener('visibilitychange',()=>{if(active&&document.hidden&&['show','quiz'].includes(key))rpc('ping_leave',{p_token:tok}).catch(()=>{})});
  document.addEventListener('contextmenu',e=>{if(active)e.preventDefault()});
  const tick=async()=>{
    let s;try{s=await rpc('get_state',{p_code:code,p_token:tok})}catch{return}
    if(s.err){stop();delete localStorage['rt-'+code];return student()}
    if(s.submitted){stop();return view(`<h1>${esc(s.title)}</h1><div class="card"><p>Відповіді надіслано. Ваш результат:</p><div class="big">${s.score} з ${s.total}</div><p>Оцінка: ${Math.max(1,Math.round(12*s.score/s.total))} з 12</p></div>`)}
    if(s.phase==key)return;key=s.phase;
    if(key=='wait')view(`<h1>${esc(s.title)}</h1><div class="card"><p>Чекаємо, поки вчитель почне. Не закривайте цю сторінку.</p></div>`);
    else if(key=='show'){
      view(`<h1>${esc(s.title)}</h1>${s.left!=null?'<div class="timer" id="tm"></div><p class="mut" id="cd"></p>':''}<div class="card read">${esc(s.text).replace(/\n/g,'<br>')}</div>`);
      if(s.left!=null){const tot=s.left;dl=Date.now()+s.left*1000;
        cd=setInterval(()=>{const r=Math.max(0,Math.ceil((dl-Date.now())/1000));$('#cd').textContent='Залишилось '+r+' с';$('#tm').style.width=(tot?r/tot*100:0)+'%';if(!r){clearInterval(cd);tick()}},1000)}
      else $('#cd')&&0;
    }else if(key=='quiz'){clearInterval(cd);quiz(s)}
    else if(key=='done'){if(send){const f=send;key='';await f(true);return}stop();view('<h1>Час вийшов</h1><div class="card"><p>Заняття завершено, відповіді вже не приймаються.</p></div>')}
  };
  const quiz=s=>{
    const Q=sh(s.qs.map((x,i)=>({i,q:x.q,o:sh(x.o.map((t,j)=>({j,t})))})));
    view(`<h1>${esc(s.title)}</h1>${s.left!=null?'<p class="mut" id="qc"></p>':''}${Q.map((x,k)=>`<div class="card q"><h2>${k+1}. ${esc(x.q)}</h2>${x.o.map(o=>`<label class="o"><input type="radio" name="q${x.i}" value="${o.j}">${esc(o.t)}</label>`).join('')}</div>`).join('')}
    <button class="pri" id="s">Надіслати відповіді</button><p class="err" id="e"></p>`);
    send=async force=>{
      const ans=s.qs.map((_,i)=>{const r=document.querySelector(`input[name=q${i}]:checked`);return r?+r.value:null});
      if(!force&&ans.includes(null)&&!confirm('Не на всі питання є відповідь. Надіслати все одно?'))return;
      try{await rpc('submit',{p_code:code,p_token:tok,p_ans:ans});send=null;key='';tick()}catch(e){if(e.message=='already'){send=null;key='';return tick()}if(force){send=null;stop();view('<h1>Час вийшов</h1><div class="card"><p>Відповіді не встигли надіслатися.</p></div>')}else $('#e').textContent=say(e)}};
    $('#s').onclick=()=>send&&send();
    if(s.left!=null){const t0=Date.now()+s.left*1000;cd=setInterval(()=>{const r=Math.max(0,Math.ceil((t0-Date.now())/1000));$('#qc').textContent='Залишилось на відповіді: '+r+' с';if(!r){clearInterval(cd);send&&send(true)}},1000)}
  };
  poll=setInterval(tick,2500);tick();
}

student();
</script>
</body>
</html>
