  b.innerHTML='<b>Режим перегляду.</b> Нічого не зберігається'+(d.data.type=='audio'?', звук не відтворюється':'')+'. <button id="pvq" class="pri" style="margin:4px 0 0">Перейти до тесту</button> <button id="pvc" style="margin:4px 0 0">Закрити</button>';
  document.body.appendChild(b);
  $('#pvq').onclick=()=>{const secs=d.data.secs||0;if(!PV.quizAt&&(secs==0||Date.now()<PV.t0+secs*1000))PV.quizAt=Date.now()};
  $('#pvc').onclick=()=>window.close();
  localStorage['rn-PREVIEW']='Перегляд';run('PREVIEW','preview')}
/* ================= УЧЕНЬ ================= */
function student(){
  if(PREVIEW){previewStart();return}
  const c0=new URLSearchParams(location.search).get('c')||'';
  view(`<h1>Приєднатися до тесту</h1><div class="card"><label>Код заняття<input type="text" id="c" value="${esc(c0)}" maxlength="6" autocapitalize="characters" autocomplete="off"></label>
  <label>Ваше ім'я<input type="text" id="n" maxlength="40" autocomplete="off"></label><button class="pri" id="j">Приєднатися</button><p class="err" id="e"></p></div>`);
  $('#j').onclick=async()=>{const c=$('#c').value.trim().toUpperCase();
    if(localStorage['rt-'+c])return run(c,localStorage['rt-'+c]);
    try{const tk=await rpc('join_session',{p_code:c,p_name:$('#n').value});localStorage['rt-'+c]=tk;localStorage['rn-'+c]=$('#n').value.trim();run(c,tk)}catch(e){$('#e').textContent=say(e)}};
  const m=Object.keys(localStorage).find(k=>k.startsWith('rt-')&&k.slice(3)==c0.toUpperCase());
  if(m)run(c0.toUpperCase(),localStorage[m]);
}
function run(code,tok){CT={code,tok};
  let key='',active=true,dl=0,cd,poll,send=null,qsync=null;
  let rec=false;
  const bu=e=>{if(active&&!PREVIEW&&key=='quiz'){e.preventDefault();e.returnValue=''}};
  addEventListener('beforeunload',bu);
  const stop=()=>{active=false;clearInterval(poll);clearInterval(cd);removeEventListener('beforeunload',bu)};
  document.addEventListener('visibilitychange',()=>{if(active&&document.hidden&&['show','quiz'].includes(key))rpc('ping_leave',{p_token:tok}).catch(()=>{})});
  document.addEventListener('contextmenu',e=>{if(active)e.preventDefault()});
  function result(s){
    const nm=localStorage['rn-'+code]||'—',n=s.total,ok=+(+s.score).toFixed(2),fl=s.full??ok,pt=s.part||0,sk=s.skipped||0,bad=n-fl-pt-sk,pct=n?Math.round(ok/n*100):0,
      g=s.grade??Math.max(1,Math.round(12*ok/n)),R=s.review,
      dt=s.finished?new Date(s.finished).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'',
      took=s.took!=null?Math.floor(s.took/60)+' хв '+s.took%60+' с':'—',C=2*Math.PI*42,
      st=R?R.map(r=>r.mine==null?'sk':r.ok?'ok':r.pts>0?'pt':'bad'):[],
      lbl={ok:'Правильно',pt:'Частково',bad:'Неправильно',sk:'Пропущено'},sym={ok:'✓',pt:'±',bad:'✕',sk:'–'},
      dot=c=>`<span class="dot ${c}">${sym[c]||'★'}</span>`,
      rec=st.map((x,i)=>x=='ok'?0:i+1).filter(Boolean),
      donut=`<svg viewBox="0 0 100 100" width="104" height="104" role="img" aria-label="${pct}%"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="var(--g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${pct}%</text></svg>`;
    view(`<div class="rh"><div class="rb"><b style="font-size:1.15rem">Читання й тест</b><span class="mut sm">Українська мова та література</span></div><span class="mut sm" style="text-align:right">Звіт про результати<br>${dt}</span></div>
    <div class="row" style="margin:18px 0"><div><h1 style="font-size:1.9rem">Результати тесту</h1><p class="mut" style="margin:4px 0 0;font-size:1.1rem">${esc(s.title)}</p></div><div class="card ok-box" style="margin:0"><b>Завершено</b><br><span class="sm">Результат зафіксовано</span></div></div>
    <div class="meta"><div><span class="mut sm">Дата проходження</span><br><b>${dt}</b></div><div><span class="mut sm">Учасник</span><br><b>${esc(nm)}</b></div><div><span class="mut sm">Тест</span><br><b>${esc(s.title)}</b></div></div>
    <div class="card big3"><div><span class="mut">Ваш результат</span><div class="big">${ok} з ${n}</div><div>Оцінка: <b>${g}</b> з 12</div></div>
      <div class="dn">${donut}<div><span class="mut">Набрано балів</span><br><b>${ok} з ${n}</b><div class="pb" style="width:140px;height:7px;border-radius:4px;background:var(--line)"><i style="display:block;height:100%;border-radius:4px;background:var(--g);width:${pct}%"></i></div></div></div>
      <div><span class="mut sm">Час виконання</span><br><b>${took}</b><br><span class="mut sm">Статус</span><br><b>Завершено</b></div></div>
    <h2>Розбір результатів</h2>
    <div class="g4">${[['ok','Повністю правильних',fl],...(pt?[['pt','Частково правильних',pt]]:[]),['bad','Неправильних відповідей',bad],['sk','Пропущено',sk]].map(([c,l,v])=>`<div class="card">${dot(c)}<div class="mut sm">${l}</div><b class="n">${v}</b><div class="mut sm">${Math.round(v/n*100)}% від загальної кількості</div></div>`).join('')}<div class="card">${dot('')}<div class="mut sm">Оцінка за тест</div><b class="n">${g}</b> <span class="mut">/ 12</span></div></div>
    ${R?`<div class="g2" style="margin-top:12px"><div class="card"><h2 style="margin-top:0">Результати за питаннями</h2>${R.map((r,i)=>`<div class="qr"><span class="no">${i+1}</span><span>${esc(r.q)}</span><span class="rc ${st[i]}">${lbl[st[i]]}</span></div>`).join('')}</div>
      <div class="card" style="overflow-x:auto"><h2 style="margin-top:0">Відповіді учасника</h2><table><tr><th>№</th><th>Ваша відповідь</th><th>Правильна відповідь</th><th></th></tr>${R.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(fa(r,r.mine))}</td><td>${esc(fk(r))}</td><td>${dot(st[i])}</td></tr>`).join('')}</table></div></div>
      ${R.some(r=>r.expl)?`<div class="card" style="margin-top:12px"><h2 style="margin-top:0">Пояснення до відповідей</h2>${R.map((r,i)=>r.expl?`<div style="padding:8px 0;border-top:1px solid var(--line)"><b>${i+1}. ${esc(r.q)}</b><div class="mut read" style="font:inherit;user-select:auto">${md(r.expl)}</div></div>`:'').join('')}</div>`:''}<div class="card rec"><b>Рекомендація</b><br>${rec.length?'Зверніть увагу на питання №'+rec.join(', ')+': саме в них були помилки чи пропуски.':'Помилок немає. Чудовий результат!'}</div>`
    :`<div class="card rec noprint">Розбір за питаннями з’явиться тут після завершення заняття, якщо вчитель дозволить показ правильних відповідей. Ця сторінка оновиться сама.</div>`}
    <p class="noprint" style="margin-top:16px"><button class="pri" id="pr">Зберегти як PDF або роздрукувати</button></p><p class="mut sm noprint">У вікні друку оберіть «Зберегти як PDF».</p>
    <div class="rf mut sm">Читання й тест. Українська мова та література</div>`);
    $('#app').classList.add('wide');$('#pr').onclick=()=>print()}
  let au=null;
  function audioUI(n){
    const el=$('#au');if(!el)return;
    el.innerHTML=`<div style="text-align:center"><button class="pri" id="pl" style="font-size:1.3rem;padding:14px 28px" ${n>0?'':'disabled'}>${n>0?'Слухати':'Прослуховування завершено'}</button><p class="mut">Залишилось прослуховувань: ${n}</p><p class="err" id="ae"></p></div>`;
    $('#pl').onclick=async()=>{
      const b=$('#pl');b.disabled=true;b.textContent='Завантаження…';let left=n;
      au=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');au.play().catch(()=>{});
      try{const d=await rpc('play_audio',{p_code:code,p_token:tok});left=d.left;
        const url=URL.createObjectURL(new Blob([Uint8Array.from(atob(d.data),c=>c.charCodeAt(0))],{type:d.mime}));
        au.onended=()=>{URL.revokeObjectURL(url);audioUI(left)};
        au.src=url;await au.play();b.textContent='Звучить…'}
      catch(e){audioUI(left);$('#ae').textContent=say(e)}};
  }
  const tick=async()=>{
    let s;try{s=await rpc('get_state',{p_code:code,p_token:tok})}catch{return}
    if(s.err){stop();delete localStorage['rt-'+code];return student()}
    if(s.submitted){try{localStorage.removeItem('ra-'+code+'-'+tok)}catch{}const k2='r'+s.phase+(s.review?1:0);
      if(k2!=key){key=k2;result(s);clearInterval(poll);if(s.phase!='done')poll=setInterval(tick,8000)}
      if(s.phase=='done')stop();return}
    if(s.phase==key){if(key=='quiz'&&qsync&&s.left!=null)qsync(s.left);return}key=s.phase;
    if(key=='wait')view(`<h1>${esc(s.title)}</h1><div class="card"><p>Чекаємо, поки вчитель почне. Не закривайте цю сторінку.</p></div>`);
    else if(key=='show'){
      view(`<div class="row"><h1>${esc(s.title)}</h1>${s.audio?'':fsBar()}</div>${s.left!=null?'<div class="timer" id="tm"></div><p class="mut" id="cd"></p>':''}${s.audio?'<div class="card" id="au"></div>':`<div class="card read">${md(s.text)}</div>`}`);
      if(s.audio)audioUI(s.plays_left);if(s.left!=null){const tot=s.left;dl=Date.now()+s.left*1000;
        cd=setInterval(()=>{const r=Math.max(0,Math.ceil((dl-Date.now())/1000));$('#cd').textContent='Залишилось '+r+' с';$('#tm').style.width=(tot?r/tot*100:0)+'%';if(!r){clearInterval(cd);tick()}},1000)}
      else $('#cd')&&0;
    }else if(key=='quiz'){clearInterval(cd);au&&au.pause();quiz(s)}
    else if(key=='done'){if(send){const f=send;key='';await f(true);return}
      let sv0=null;try{sv0=JSON.parse(localStorage['ra-'+code+'-'+tok]||'null')}catch{}
      if(sv0&&sv0.a&&!rec&&!PREVIEW){rec=true;
        try{await rpc('submit',{p_code:code,p_token:tok,p_ans:Array.from({length:sv0.n},(_,i)=>nA(sv0.a[i]))});
          try{localStorage.removeItem('ra-'+code+'-'+tok)}catch{}key='';rec=false;tick();return}
        catch(e){if(e.message=='already'){key='';rec=false;return tick()}if(e.message=='net'){key='';rec=false;return}}}
      stop();view('<h1>Час вийшов</h1><div class="card"><p>'+(sv0?'Час вийшов, а збережені відповіді надіслати не вдалося. Зверніться до вчителя.':'Заняття завершено, відповіді вже не приймаються.')+'</p></div>')}
  };
  const quiz=s=>{
    const rs=(a,k)=>PREVIEW?sh(a):shs(a,hs(code+'|'+tok+'|'+k)),
      Q0=s.qs.map((x,i)=>({i,t:x.type||'single',q:x.q,o:x.o?(s.shuf===false?x.o.map((t,j)=>({j,t})):rs(x.o.map((t,j)=>({j,t})),'o'+i)):null,l:x.l,r:x.r?rs(x.r,'r'+i):null})),
      Q=s.shq===false?Q0:rs(Q0,'q'),A={},n=Q.length,C=2*Math.PI*52;
    const has=x=>{const a=A[x.i];if(x.t=='multi')return !!(a&&a.length);if(x.t=='short')return !!(a&&a.trim());if(x.t=='match')return !!(a&&x.l.every((_,k)=>a[k]));return a!=null};
    let k=0,qrem=s.left,qtot=s.left;
    const fT=r=>String(r/60|0).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
    const AK='ra-'+code+'-'+tok,sv=()=>{if(PREVIEW)return;try{localStorage[AK]=JSON.stringify({n,a:A,k});NET.sf=false;NET.saved=new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})}catch{NET.sf=true}netUI()};
    if(!PREVIEW)try{const o=JSON.parse(localStorage[AK]||'null');if(o&&o.n==n){Object.assign(A,o.a);if(Number.isInteger(o.k)&&o.k>=0&&o.k<n)k=o.k}}catch{}
    const skipped=()=>Q.map((x,m)=>has(x)?0:m+1).filter(Boolean);
    const clock=()=>{if(qrem==null)return;document.querySelectorAll('.tt').forEach(e=>e.textContent=fT(qrem));
      const g=$('#rg');if(g)g.style.strokeDashoffset=C*(1-(qtot?qrem/qtot:0))};
    const upd=()=>{sv();const c=document.querySelector('.qn.cur');c&&c.classList.toggle('done',has(Q[k]));const m=Q.filter(has).length;
      $('#ac').textContent='Відповіли: '+m+' з '+n;$('#ab').style.width=m/n*100+'%'};
    const body=x=>x.t=='short'?`<input type="text" id="sa" class="sa" placeholder="Впишіть відповідь" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(A[x.i]||'')}">`
      :x.t=='match'?`<p class="mut sm">Оберіть для кожного пункту відповідну пару.</p>${x.l.map((l,m)=>`<div class="mrow"><span>${esc(l)}</span><select data-m="${m}" aria-label="${esc(l)}"><option value="">— оберіть —</option>${x.r.map(r=>`<option value="${esc(r)}" ${A[x.i]&&A[x.i][m]===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`).join('')}`
      :`${x.t=='multi'?'<p class="mut sm">Оберіть усі правильні відповіді.</p>':''}${x.o.map(o=>`<label class="o"><input type="${x.t=='multi'?'checkbox':'radio'}" name="q" value="${o.j}" ${(x.t=='multi'?(A[x.i]||[]).includes(o.j):A[x.i]===o.j)?'checked':''}><span>${esc(o.t)}</span></label>`).join('')}`;
    const draw=()=>{const x=Q[k],m=Q.filter(has).length,timed=qrem!=null;
      $('#app').classList.add('wide');
      view(`<div class="row" style="margin-bottom:14px"><div><b style="font-size:1.25rem">Тестування</b><div class="mut sm">${esc(s.title)}</div></div><div class="row" style="gap:10px;justify-content:flex-end"><span id="net" class="net"></span>${fsBar()}</div></div>
      <div class="qg"><div>
        <div class="card qi"><span class="ico2"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z M14 3v5h5 M9 13h6 M9 17h6"/></svg></span>
          <div style="flex:1"><b style="font-size:1.1rem">${esc(s.title)}</b><div class="mut sm">${n} питань${timed?', час на тест обмежено':''}</div></div><span class="rc ok">Активний</span></div>
        <div class="card qc"><div class="row"><span class="mut sm">Питання ${k+1} з ${n}</span>${timed?'<span class="mut tt" style="font-variant-numeric:tabular-nums"></span>':''}</div>
          <div class="pb" style="height:7px;border-radius:4px;background:var(--line);margin-top:6px"><i style="display:block;height:100%;border-radius:4px;background:var(--g);width:${(k+1)/n*100}%"></i></div>
          <h2 class="qt">${k+1}. ${mdi(x.q)}</h2>
          ${body(x)}
          <div class="qf"><button id="pv" ${k?'':'disabled'}>← Попереднє питання</button>${k<n-1?'<button class="pri" id="nx">Наступне питання →</button>':'<button class="pri fin">Завершити тест</button>'}</div>
        </div><p class="err" id="e"></p>
      </div>
      <aside class="card">
        ${timed?`<div class="ring"><svg viewBox="0 0 120 120" width="150" height="150" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="9"/><circle id="rg" cx="60" cy="60" r="52" fill="none" stroke="var(--g)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" transform="rotate(-90 60 60)"/></svg><div class="rt"><b class="tt"></b><span class="mut sm">Час до завершення</span></div></div>`:''}
        <div class="mut sm" id="ac">Відповіли: ${m} з ${n}</div><div class="pb" style="height:7px;border-radius:4px;background:var(--line);margin:4px 0 16px"><i id="ab" style="display:block;height:100%;border-radius:4px;background:var(--g);width:${m/n*100}%"></i></div>
        <b>Навігація по питаннях</b>
        <div class="nvg">${Q.map((y,i)=>`<button class="qn${has(y)?' done':''}${i==k?' cur':''}" data-n="${i}" aria-label="Питання ${i+1}${has(y)?', відповідь дано':''}">${i+1}</button>`).join('')}</div>
        <div class="lg"><span><i class="a"></i>Відповідено</span><span><i class="c"></i>Поточне питання</span><span><i></i>Не відповідено</span></div>
        <div class="tip"><b>Порада</b><br>Уважно читайте запитання та всі варіанти відповідей.${timed?' Час на тест обмежений, слідкуйте за таймером.':''}</div>
        <button class="fin" style="width:100%;margin:0">Завершити тест</button>
      </aside></div>
      <dialog id="dg" aria-labelledby="dm"><p id="dm"></p><button id="no" autofocus>Повернутися</button><button class="pri" id="yes">Так, завершити</button></dialog>`);
      clock();sv();
      document.querySelectorAll('.qn').forEach(b=>b.onclick=()=>{k=+b.dataset.n;draw()});
      document.querySelectorAll('input[name=q]').forEach(i=>i.onchange=()=>{
        if(x.t=='multi')A[x.i]=[...document.querySelectorAll('input[name=q]:checked')].map(c=>+c.value).sort((a,b)=>a-b);else A[x.i]=+i.value;upd()});
      const sa=$('#sa');if(sa)sa.oninput=()=>{A[x.i]=sa.value;upd()};
      document.querySelectorAll('select[data-m]').forEach(sel=>sel.onchange=()=>{const a=A[x.i]||(A[x.i]=x.l.map(()=>null));a[+sel.dataset.m]=sel.value||null;upd()});
      if(k)$('#pv').onclick=()=>{k--;draw()};if($('#nx'))$('#nx').onclick=()=>{k++;draw()};
      document.querySelectorAll('.fin').forEach(b=>b.onclick=()=>{const sk=skipped();
        $('#dm').textContent=sk.length?`Ви не відповіли на питання: ${sk.join(', ')}. Завершити тест без них? Після цього змінити відповіді буде неможливо.`:'Ви впевнені, що хочете завершити тест? Після цього змінити відповіді буде неможливо.';
        $('#dg').showModal()});
      $('#no').onclick=()=>$('#dg').close();$('#yes').onclick=()=>{$('#dg').close();send&&send()};
    };
    send=async force=>{
      const ans=s.qs.map((_,i)=>nA(A[i]));
      try{await rpc('submit',{p_code:code,p_token:tok,p_ans:ans});send=null;try{localStorage.removeItem(AK)}catch{}key='';tick()}
      catch(e){if(e.message=='already'){send=null;key='';return tick()}
        if(force&&e.message!='net'){send=null;stop();view('<h1>Час вийшов</h1><div class="card"><p>Відповіді не встигли надіслатися.</p></div>')}
        else{const er=$('#e');if(er)er.textContent=say(e);if(force)NET.retry=()=>send&&send(true)}}};
    draw();
    if(qrem!=null){let t0=Date.now()+qrem*1000;qsync=l=>{t0=Date.now()+l*1000;if(l>qtot)qtot=l};cd=setInterval(()=>{qrem=Math.max(0,Math.ceil((t0-Date.now())/1000));clock();if(!qrem){clearInterval(cd);send&&send(true)}},1000)}
  };
  poll=setInterval(tick,2500);tick();
}

student();
</script>
</body>
</html>
