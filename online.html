<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест онлайн</title>
<style>
:root{--bg:#eef2f0;--ink:#16231e;--g:#0f6b52;--g2:#d8e9e2;--mut:#5b6b64;--line:#c5d3cc;--bad:#b3392f;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#121a17;--ink:#e6efeb;--g:#3fb18f;--g2:#1d2e28;--mut:#9fb2aa;--line:#2f433b;--card:#18231f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 12px}h2{font-size:1.1rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:12px}
input[type=text],input[type=email],input[type=password]{display:block;width:100%;margin-top:4px;padding:9px 10px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px}
button,.btn{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin:0 6px 6px 0;display:inline-block}
button:focus-visible,input:focus-visible{outline:3px solid var(--g);outline-offset:1px}
.pri{background:var(--g);border-color:var(--g);color:#fff}.danger{color:var(--bad)}
.err{color:var(--bad);min-height:1.5em}.mut{color:var(--mut)}
.code{font:700 2rem/1 ui-monospace,Consolas,monospace;letter-spacing:.15em}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{text-align:left;padding:6px 8px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.read{font:1.35rem/1.7 Georgia,serif;user-select:none;-webkit-user-select:none}
.timer{height:8px;background:var(--g);border-radius:4px;margin-bottom:16px;transition:width 1s linear}
.q{margin-bottom:20px}.q h2{font-family:Georgia,serif;font-size:1.25rem}
.o{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-top:6px;cursor:pointer;font-weight:400}
.o input{width:20px;height:20px;accent-color:var(--g);margin:0}
.big{font-size:2.4rem;font-weight:700;color:var(--g)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{min-width:42px;margin:0;padding:6px 8px}.chip.done{background:var(--g2);border-color:var(--g)}.chip.cur{outline:3px solid var(--g);outline-offset:1px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:420px;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media print{button,.nav{display:none}body{background:#fff;color:#000}}

#app.wide{max-width:980px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.rb{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;color:var(--g)}
.ok-box{background:var(--g2);color:var(--g);margin:0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.big3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;align-items:center;background:var(--g2)}
.dn{display:flex;gap:14px;align-items:center}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.n{font-size:1.9rem;line-height:1.2;display:inline-block}
.dot{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:.85rem;margin-bottom:6px}
.dot.ok{background:var(--g)}.dot.bad{background:var(--bad)}.dot.sk{background:#8b97a0}
.qr{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.no{width:26px;height:26px;border-radius:50%;background:var(--g2);display:grid;place-items:center;font-size:.8rem}
.rc{padding:1px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.rc.ok{background:var(--g2);color:var(--g)}.rc.bad{background:#fbe4e1;color:var(--bad)}.rc.sk{background:var(--line);color:var(--mut)}
.rec{background:var(--g2);margin-top:12px}
.rf{border-top:1px solid var(--line);margin-top:18px;padding-top:10px}
td,th{text-align:left;padding:6px 8px;border-top:1px solid var(--line);font-size:.92rem}th{border-top:0;color:var(--mut);font-size:.8rem}
@media print{
 @page{size:A4;margin:12mm}
 :root{--bg:#fff;--ink:#16231e;--g:#0f6b52;--g2:#e1efe9;--mut:#5f6f68;--line:#dbe4df;--card:#fff;--bad:#b3392f}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .noprint{display:none!important}#app{max-width:none;padding:0}.card{break-inside:avoid}body{font-size:12.5px}}

button:disabled{opacity:.5;cursor:default}
.qg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:860px){.qg{grid-template-columns:1fr}}
.qi{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ico2{width:48px;height:48px;border-radius:14px;background:var(--g2);color:var(--g);display:grid;place-items:center;flex:none}
.qc .o{padding:14px 16px;font-size:1.05rem;border-radius:12px;margin-top:10px}
.qc .o:has(input:checked){background:var(--g2);border-color:var(--g)}
.qt{font:600 1.35rem/1.35 Georgia,serif;margin:18px 0 6px}
.qf{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.nvg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 14px}
.qn{width:100%;aspect-ratio:1;border-radius:50%;padding:0;margin:0;font-weight:600;background:var(--card)}
.qn.cur{background:var(--g2);box-shadow:0 0 0 3px var(--g)}
.qn.done{background:var(--g);border-color:var(--g);color:#fff}
.lg{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--mut);margin-bottom:14px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px;border:2px solid var(--line)}
.lg i.a{background:var(--g);border-color:var(--g)}.lg i.c{background:var(--g2);border-color:var(--g)}
.tip{background:var(--g2);border-radius:12px;padding:12px;font-size:.88rem;margin-bottom:12px}
.ring{position:relative;width:150px;margin:0 auto 14px}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rt b{font-size:1.55rem;font-variant-numeric:tabular-nums}#rg{transition:stroke-dashoffset 1s linear}
</style>
</head>
<body>
<div id="app"></div>
<script>
const URL_='https://nyilajegoqdhujnvhsoe.supabase.co',KEY_='sb_publishable_HgNdf6MvwSLU4_7r5a-vrA_KKUvR9aw';
const $=s=>document.querySelector(s),view=h=>$('#app').innerHTML=h;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let TOK=sessionStorage.tk||null;
async function api(path,{method='GET',body,prefer}={}){
  const h={apikey:KEY_,'Content-Type':'application/json'};if(TOK)h.Authorization='Bearer '+TOK;if(prefer)h.Prefer=prefer;
  const r=await fetch(URL_+path,{method,headers:h,body:body&&JSON.stringify(body)});
  const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}
  if(!r.ok){if(r.status==401&&TOK){delete sessionStorage.tk;TOK=null}throw new Error((d&&(d.message||d.msg||d.error_description))||r.status)}
  return d}
const rpc=(n,b)=>api('/rest/v1/rpc/'+n,{method:'POST',body:b});
const MSG={no_session:'Заняття з таким кодом не знайдено або воно вже завершене.',name_taken:'Це ім\'я вже використано в цьому занятті. Якщо це ви, зверніться до вчителя.',bad_name:'Введіть ім\'я (до 40 символів).',closed:'Час на відповіді закінчився.',already:'Ви вже надіслали відповіді.',no_plays:'Прослуховування вичерпано.',no_audio:'Аудіофайл не знайдено.',started:'Тест уже розпочався, приєднатися не можна. Зверніться до вчителя.'};
const say=e=>MSG[e.message]||e.message;

/* ================= УЧЕНЬ ================= */
function student(){
  const c0=new URLSearchParams(location.search).get('c')||'';
  view(`<h1>Приєднатися до тесту</h1><div class="card"><label>Код заняття<input type="text" id="c" value="${esc(c0)}" maxlength="6" autocapitalize="characters" autocomplete="off"></label>
  <label>Ваше ім'я<input type="text" id="n" maxlength="40" autocomplete="off"></label><button class="pri" id="j">Приєднатися</button><p class="err" id="e"></p></div>`);
  $('#j').onclick=async()=>{const c=$('#c').value.trim().toUpperCase();
    if(localStorage['rt-'+c])return run(c,localStorage['rt-'+c]);
    try{const tk=await rpc('join_session',{p_code:c,p_name:$('#n').value});localStorage['rt-'+c]=tk;localStorage['rn-'+c]=$('#n').value.trim();run(c,tk)}catch(e){$('#e').textContent=say(e)}};
  const m=Object.keys(localStorage).find(k=>k.startsWith('rt-')&&k.slice(3)==c0.toUpperCase());
  if(m)run(c0.toUpperCase(),localStorage[m]);
}
function run(code,tok){
  let key='',active=true,dl=0,cd,poll,send=null,qsync=null;
  const stop=()=>{active=false;clearInterval(poll);clearInterval(cd)};
  document.addEventListener('visibilitychange',()=>{if(active&&document.hidden&&['show','quiz'].includes(key))rpc('ping_leave',{p_token:tok}).catch(()=>{})});
  document.addEventListener('contextmenu',e=>{if(active)e.preventDefault()});
  function result(s){
    const nm=localStorage['rn-'+code]||'—',n=s.total,ok=s.score,sk=s.skipped||0,bad=n-ok-sk,pct=n?Math.round(ok/n*100):0,
      g=s.grade??Math.max(1,Math.round(12*ok/n)),R=s.review,
      dt=s.finished?new Date(s.finished).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'',
      took=s.took!=null?Math.floor(s.took/60)+' хв '+s.took%60+' с':'—',C=2*Math.PI*42,
      st=R?R.map(r=>r.mine==null?'sk':r.mine==r.c?'ok':'bad'):[],
      lbl={ok:'Правильно',bad:'Неправильно',sk:'Пропущено'},sym={ok:'✓',bad:'✕',sk:'–'},
      dot=c=>`<span class="dot ${c}">${sym[c]||'★'}</span>`,
      rec=st.map((x,i)=>x=='ok'?0:i+1).filter(Boolean),
      donut=`<svg viewBox="0 0 100 100" width="104" height="104" role="img" aria-label="${pct}%"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="var(--g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${pct}%</text></svg>`;
    view(`<div class="rh"><div class="rb"><b style="font-size:1.15rem">Читання й тест</b><span class="mut sm">Українська мова та література</span></div><span class="mut sm" style="text-align:right">Звіт про результати<br>${dt}</span></div>
    <div class="row" style="margin:18px 0"><div><h1 style="font-size:1.9rem">Результати тесту</h1><p class="mut" style="margin:4px 0 0;font-size:1.1rem">${esc(s.title)}</p></div><div class="card ok-box" style="margin:0"><b>Завершено</b><br><span class="sm">Результат зафіксовано</span></div></div>
    <div class="meta"><div><span class="mut sm">Дата проходження</span><br><b>${dt}</b></div><div><span class="mut sm">Учасник</span><br><b>${esc(nm)}</b></div><div><span class="mut sm">Тест</span><br><b>${esc(s.title)}</b></div></div>
    <div class="card big3"><div><span class="mut">Ваш результат</span><div class="big">${ok} з ${n}</div><div>Оцінка: <b>${g}</b> з 12</div></div>
      <div class="dn">${donut}<div><span class="mut">Правильні відповіді</span><br><b>${ok} з ${n}</b><div class="pb" style="width:140px;height:7px;border-radius:4px;background:var(--line)"><i style="display:block;height:100%;border-radius:4px;background:var(--g);width:${pct}%"></i></div></div></div>
      <div><span class="mut sm">Час виконання</span><br><b>${took}</b><br><span class="mut sm">Статус</span><br><b>Завершено</b></div></div>
    <h2>Розбір результатів</h2>
    <div class="g4">${[['ok','Правильних відповідей',ok],['bad','Неправильних відповідей',bad],['sk','Пропущено',sk]].map(([c,l,v])=>`<div class="card">${dot(c)}<div class="mut sm">${l}</div><b class="n">${v}</b><div class="mut sm">${Math.round(v/n*100)}% від загальної кількості</div></div>`).join('')}<div class="card">${dot('')}<div class="mut sm">Оцінка за тест</div><b class="n">${g}</b> <span class="mut">/ 12</span></div></div>
    ${R?`<div class="g2" style="margin-top:12px"><div class="card"><h2 style="margin-top:0">Результати за питаннями</h2>${R.map((r,i)=>`<div class="qr"><span class="no">${i+1}</span><span>${esc(r.q)}</span><span class="rc ${st[i]}">${lbl[st[i]]}</span></div>`).join('')}</div>
      <div class="card" style="overflow-x:auto"><h2 style="margin-top:0">Відповіді учасника</h2><table><tr><th>№</th><th>Ваша відповідь</th><th>Правильна відповідь</th><th></th></tr>${R.map((r,i)=>`<tr><td>${i+1}</td><td>${r.mine==null?'—':esc(r.o[r.mine])}</td><td>${esc(r.o[r.c])}</td><td>${dot(st[i])}</td></tr>`).join('')}</table></div></div>
      <div class="card rec"><b>Рекомендація</b><br>${rec.length?'Зверніть увагу на питання №'+rec.join(', ')+': саме в них були помилки чи пропуски.':'Помилок немає. Чудовий результат!'}</div>`
    :`<div class="card rec noprint">Розбір за питаннями з’явиться тут після завершення заняття, якщо вчитель дозволить показ правильних відповідей. Ця сторінка оновиться сама.</div>`}
    <p class="noprint" style="margin-top:16px"><button class="pri" id="pr">Зберегти як PDF або роздрукувати</button></p><p class="mut sm noprint">У вікні друку оберіть «Зберегти як PDF».</p>
    <div class="rf mut sm">Читання й тест. Українська мова та література</div>`);
    $('#app').classList.add('wide');$('#pr').onclick=()=>print()}
  let au=null;
  function audioUI(n){
    const el=$('#au');if(!el)return;
    el.innerHTML=`<div style="text-align:center"><button class="pri" id="pl" style="font-size:1.3rem;padding:14px 28px" ${n>0?'':'disabled'}>${n>0?'Слухати':'Прослуховування завершено'}</button><p class="mut">Залишилось прослуховувань: ${n}</p><p class="err" id="ae"></p></div>`;
    $('#pl').onclick=async()=>{
      const b=$('#pl');b.disabled=true;b.textContent='Завантаження…';let left=n;
      au=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');au.play().catch(()=>{});
      try{const d=await rpc('play_audio',{p_code:code,p_token:tok});left=d.left;
        const url=URL.createObjectURL(new Blob([Uint8Array.from(atob(d.data),c=>c.charCodeAt(0))],{type:d.mime}));
        au.onended=()=>{URL.revokeObjectURL(url);audioUI(left)};
        au.src=url;await au.play();b.textContent='Звучить…'}
      catch(e){audioUI(left);$('#ae').textContent=say(e)}};
  }
  const tick=async()=>{
    let s;try{s=await rpc('get_state',{p_code:code,p_token:tok})}catch{return}
    if(s.err){stop();delete localStorage['rt-'+code];return student()}
    if(s.submitted){const k2='r'+s.phase+(s.review?1:0);
      if(k2!=key){key=k2;result(s);clearInterval(poll);if(s.phase!='done')poll=setInterval(tick,8000)}
      if(s.phase=='done')stop();return}
    if(s.phase==key){if(key=='quiz'&&qsync&&s.left!=null)qsync(s.left);return}key=s.phase;
    if(key=='wait')view(`<h1>${esc(s.title)}</h1><div class="card"><p>Чекаємо, поки вчитель почне. Не закривайте цю сторінку.</p></div>`);
    else if(key=='show'){
      view(`<h1>${esc(s.title)}</h1>${s.left!=null?'<div class="timer" id="tm"></div><p class="mut" id="cd"></p>':''}${s.audio?'<div class="card" id="au"></div>':`<div class="card read">${esc(s.text).replace(/\n/g,'<br>')}</div>`}`);
      if(s.audio)audioUI(s.plays_left);if(s.left!=null){const tot=s.left;dl=Date.now()+s.left*1000;
        cd=setInterval(()=>{const r=Math.max(0,Math.ceil((dl-Date.now())/1000));$('#cd').textContent='Залишилось '+r+' с';$('#tm').style.width=(tot?r/tot*100:0)+'%';if(!r){clearInterval(cd);tick()}},1000)}
      else $('#cd')&&0;
    }else if(key=='quiz'){clearInterval(cd);au&&au.pause();quiz(s)}
    else if(key=='done'){if(send){const f=send;key='';await f(true);return}stop();view('<h1>Час вийшов</h1><div class="card"><p>Заняття завершено, відповіді вже не приймаються.</p></div>')}
  };
  const quiz=s=>{
    const Q=sh(s.qs.map((x,i)=>({i,q:x.q,o:sh(x.o.map((t,j)=>({j,t})))}))),A={},n=Q.length,C=2*Math.PI*52;
    let k=0,qrem=s.left,qtot=s.left;
    const fT=r=>String(r/60|0).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
    const skipped=()=>Q.map((x,m)=>A[x.i]==null?m+1:0).filter(Boolean);
    const clock=()=>{if(qrem==null)return;document.querySelectorAll('.tt').forEach(e=>e.textContent=fT(qrem));
      const g=$('#rg');if(g)g.style.strokeDashoffset=C*(1-(qtot?qrem/qtot:0))};
    const upd=()=>{const c=document.querySelector('.qn.cur');c&&c.classList.add('done');const m=Object.keys(A).length;
      $('#ac').textContent='Відповіли: '+m+' з '+n;$('#ab').style.width=m/n*100+'%'};
    const draw=()=>{const x=Q[k],m=Object.keys(A).length,timed=qrem!=null;
      $('#app').classList.add('wide');
      view(`<div style="margin-bottom:14px"><b style="font-size:1.25rem">Тестування</b><div class="mut sm">${esc(s.title)}</div></div>
      <div class="qg"><div>
        <div class="card qi"><span class="ico2"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z M14 3v5h5 M9 13h6 M9 17h6"/></svg></span>
          <div style="flex:1"><b style="font-size:1.1rem">${esc(s.title)}</b><div class="mut sm">${n} питань${timed?', час на тест обмежено':''}</div></div><span class="rc ok">Активний</span></div>
        <div class="card qc"><div class="row"><span class="mut sm">Питання ${k+1} з ${n}</span>${timed?'<span class="mut tt" style="font-variant-numeric:tabular-nums"></span>':''}</div>
          <div class="pb" style="height:7px;border-radius:4px;background:var(--line);margin-top:6px"><i style="display:block;height:100%;border-radius:4px;background:var(--g);width:${(k+1)/n*100}%"></i></div>
          <h2 class="qt">${k+1}. ${esc(x.q)}</h2>
          ${x.o.map(o=>`<label class="o"><input type="radio" name="q" value="${o.j}" ${A[x.i]===o.j?'checked':''}><span>${esc(o.t)}</span></label>`).join('')}
          <div class="qf"><button id="pv" ${k?'':'disabled'}>← Попереднє питання</button>${k<n-1?'<button class="pri" id="nx">Наступне питання →</button>':'<button class="pri fin">Завершити тест</button>'}</div>
        </div><p class="err" id="e"></p>
      </div>
      <aside class="card">
        ${timed?`<div class="ring"><svg viewBox="0 0 120 120" width="150" height="150" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="9"/><circle id="rg" cx="60" cy="60" r="52" fill="none" stroke="var(--g)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" transform="rotate(-90 60 60)"/></svg><div class="rt"><b class="tt"></b><span class="mut sm">Час до завершення</span></div></div>`:''}
        <div class="mut sm" id="ac">Відповіли: ${m} з ${n}</div><div class="pb" style="height:7px;border-radius:4px;background:var(--line);margin:4px 0 16px"><i id="ab" style="display:block;height:100%;border-radius:4px;background:var(--g);width:${m/n*100}%"></i></div>
        <b>Навігація по питаннях</b>
        <div class="nvg">${Q.map((y,i)=>`<button class="qn${A[y.i]!=null?' done':''}${i==k?' cur':''}" data-n="${i}" aria-label="Питання ${i+1}${A[y.i]!=null?', відповідь дано':''}">${i+1}</button>`).join('')}</div>
        <div class="lg"><span><i class="a"></i>Відповідено</span><span><i class="c"></i>Поточне питання</span><span><i></i>Не відповідено</span></div>
        <div class="tip"><b>Порада</b><br>Уважно читайте запитання та всі варіанти відповідей.${timed?' Час на тест обмежений, слідкуйте за таймером.':''}</div>
        <button class="fin" style="width:100%;margin:0">Завершити тест</button>
      </aside></div>
      <dialog id="dg"><p id="dm"></p><button id="no">Повернутися</button><button class="pri" id="yes">Так, завершити</button></dialog>`);
      clock();
      document.querySelectorAll('.qn').forEach(b=>b.onclick=()=>{k=+b.dataset.n;draw()});
      document.querySelectorAll('input[name=q]').forEach(i=>i.onchange=()=>{A[x.i]=+i.value;upd()});
      if(k)$('#pv').onclick=()=>{k--;draw()};if($('#nx'))$('#nx').onclick=()=>{k++;draw()};
      document.querySelectorAll('.fin').forEach(b=>b.onclick=()=>{const sk=skipped();
        $('#dm').textContent=sk.length?`Ви не відповіли на питання: ${sk.join(', ')}. Завершити тест без них? Після цього змінити відповіді буде неможливо.`:'Ви впевнені, що хочете завершити тест? Після цього змінити відповіді буде неможливо.';
        $('#dg').showModal()});
      $('#no').onclick=()=>$('#dg').close();$('#yes').onclick=()=>{$('#dg').close();send&&send()};
    };
    send=async force=>{
      const ans=s.qs.map((_,i)=>A[i]??null);
      try{await rpc('submit',{p_code:code,p_token:tok,p_ans:ans});send=null;key='';tick()}
      catch(e){if(e.message=='already'){send=null;key='';return tick()}
        if(force){send=null;stop();view('<h1>Час вийшов</h1><div class="card"><p>Відповіді не встигли надіслатися.</p></div>')}else $('#e').textContent=say(e)}};
    draw();
    if(qrem!=null){let t0=Date.now()+qrem*1000;qsync=l=>{t0=Date.now()+l*1000;if(l>qtot)qtot=l};cd=setInterval(()=>{qrem=Math.max(0,Math.ceil((t0-Date.now())/1000));clock();if(!qrem){clearInterval(cd);send&&send(true)}},1000)}
  };
  poll=setInterval(tick,2500);tick();
}

student();
</script>
</body>
</html>
